services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Single entry point for the limigo service, load-balancing across however
  # many replicas `--scale limigo=N` starts. limigo itself binds no fixed
  # host ports (they'd collide the moment there's more than one replica) —
  # traefik is the only thing on the host-facing side of the API.
  traefik:
    # v3.6 or newer: earlier v3 releases talk Docker API 1.24 to the socket,
    # which Docker Engine 29+ rejects outright (minimum API 1.40), so the
    # provider never discovers a single replica and every request 404s.
    image: traefik:v3.6
    restart: unless-stopped
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "8080:80"
    volumes:
      # Read-only, but still meaningful host Docker API access — needed so
      # traefik's Docker provider can discover limigo replicas as they're
      # scaled up or down. Same trade-off as Prometheus's mount below,
      # acceptable for a local dev stack, not a hardened production posture.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      limigo:
        condition: service_healthy

  limigo:
    build: .
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_ADDR: redis:6379
      LIMIGO_HTTP_ADDR: ":8080"
      LIMIGO_METRICS_ADDR: ":9091"
      # Unset (default) resolves to an empty string, which main.go's
      # envOrDefault treats as blank and falls back to its own 10ms default —
      # so this is a no-op for every caller except bench/run-flush-sweep.sh
      # (ticket 09), which exports this in its own shell before `docker
      # compose up` to sweep the accuracy/latency knob (CONTEXT.md: flush
      # interval).
      LIMIGO_CACHE_FLUSH_INTERVAL: ${LIMIGO_CACHE_FLUSH_INTERVAL:-}
    # Docker's own check is liveness (/healthz: is the process up), which is
    # what `--wait` and depends_on gate on. Traefik's check below is
    # readiness (/readyz), which a draining replica fails on purpose.
    healthcheck:
      test: ["CMD", "./healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 5
    # On SIGTERM a replica fails /readyz, keeps serving for --drain-delay
    # (6s, one Traefik check interval plus slack) so the proxy stops routing
    # to it, then drains in-flight requests for up to --shutdown-timeout
    # (10s). Docker's default 10s grace would SIGKILL it mid-drain.
    stop_grace_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.limigo.rule=PathPrefix(`/`)"
      - "traefik.http.routers.limigo.entrypoints=web"
      - "traefik.http.services.limigo.loadbalancer.server.port=8080"
      # Readiness, not liveness: a replica that has begun shutting down
      # answers 503 here so Traefik routes new requests to its peers while
      # it finishes the ones in flight. /healthz stays the control endpoint
      # for benchmarks and must not gain readiness logic (internal/api/healthz.go).
      - "traefik.http.services.limigo.loadbalancer.healthcheck.path=/readyz"
      - "traefik.http.services.limigo.loadbalancer.healthcheck.interval=5s"
      # Discovery hint for Prometheus's docker_sd_configs (see
      # prometheus/prometheus.yml) — not read by traefik.
      - "prometheus.scrape=true"

  prometheus:
    image: prom/prometheus:v3.14.0
    restart: unless-stopped
    # prom/prometheus drops to a non-root user by default, which can't read
    # the host's docker.sock (root-owned, group-restricted). Needed for
    # docker_sd_configs below; acceptable for a local dev stack, not a
    # hardened production posture.
    user: root
    depends_on:
      - limigo
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Read-only Docker socket access so Prometheus can discover every
      # limigo replica via docker_sd_configs, instead of a static target
      # that would only ever describe one container.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.1
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
