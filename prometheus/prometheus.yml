global:
  scrape_interval: 5s

scrape_configs:
  - job_name: limigo
    # Static targets only ever describe one instance. With `--scale
    # limigo=N`, replicas come and go under the same service name, so
    # discovery has to go through the Docker API (read-only socket mount —
    # see docker-compose.yml) rather than a fixed address.
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 15s
        filters:
          - name: label
            values: ["prometheus.scrape=true"]
    relabel_configs:
      # Each container's Dockerfile EXPOSEs two ports (8080, 9091); keep only
      # the metrics one.
      - source_labels: [__meta_docker_port_private]
        regex: "9091"
        action: keep
      - source_labels: [__meta_docker_network_ip, __meta_docker_port_private]
        separator: ":"
        target_label: __address__
      - source_labels: [__meta_docker_container_name]
        regex: "/(.*)"
        target_label: instance
