rules:
  - name: free-tier-fixed-window
    match:
      header: X-Plan
      value: free
    limit: 100
    window: 60s
    algorithm: fixed_window

  - name: pro-tier-sliding-window
    match:
      header: X-Plan
      value: pro
    limit: 10000
    window: 60s
    algorithm: sliding_window

  - name: burst-tier-token-bucket
    match:
      header: X-Plan
      value: burst
    limit: 1000
    window: 60s
    algorithm: token_bucket
