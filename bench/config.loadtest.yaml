# Load-test rule configs for tickets 07/08 (throughput + overshoot harnesses).
# Not used by the control runs in ticket 06, which hit /healthz and never touch
# rule logic at all — this file exists so those later runs have somewhere to
# point --config.
#
# Every "load-test-*" rule below except load-test-deny sets its limit far above
# any offered load the generator can produce on this hardware. Without that
# headroom, a high-rate attack against a normal rule (e.g. config.example.yaml's
# 100-per-60s free tier) denies almost every request within the first
# millisecond, and a denial is the cheap path (CONTEXT.md: allow path vs denial
# path). Publishing that number as "throughput" would measure how fast Limigo
# can say no, not how fast it can do the work a real allowed request costs: a
# counter mutation and, for uncached rules, a Lua round-trip to Redis.
#
# load-test-deny is the deliberate exception: limit 1 per window, so every
# request past the first is denied — this is what ticket 07's denial-path run
# points at, and it must stay labelled as denial-path, never blended with the
# allow-path rows above.
#
# None of these rules set local_cache — the cached-vs-uncached comparison uses
# the existing burst-tier/cached-tier pair in config.example.yaml instead (see
# docs/plans/benchmark-load-test.md, "Repo facts"). Constructing a second pair
# here would just be a second, redundant A/B.
rules:
  - name: load-test-fixed-window
    match:
      header: X-Plan
      value: loadtest-fixed_window
    algorithm: fixed_window
    fixed_window:
      limit: 100000000
      window: 60s

  - name: load-test-sliding-window
    match:
      header: X-Plan
      value: loadtest-sliding_window
    algorithm: sliding_window
    sliding_window:
      limit: 100000000
      window: 60s

  - name: load-test-token-bucket
    match:
      header: X-Plan
      value: loadtest-token_bucket
    algorithm: token_bucket
    token_bucket:
      capacity: 100000000
      rate: 10000000

  - name: load-test-leaky-bucket
    match:
      header: X-Plan
      value: loadtest-leaky_bucket
    algorithm: leaky_bucket
    leaky_bucket:
      limit: 100000000
      window: 60s
      burst: 100000000

  - name: load-test-deny
    match:
      header: X-Plan
      value: loadtest-deny
    algorithm: fixed_window
    fixed_window:
      limit: 1
      window: 60s
